<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- the sessionmixer mark: a stereo meter over four fader channels, in the window's own hues: the canvas dark,
       the meter's green-to-red gradient, and the fader caps in the ui's steel blue. -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#1f2226"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#3a3e44" stroke-width="8"/>
  <!-- the stereo meter: two rows of segments, left and right, lit from green through yellow to red -->
  <g>
    <rect x="88" y="96" width="336" height="28" rx="6" fill="#2c3036"/>
    <rect x="96" y="102" width="40" height="16" rx="3" fill="#3fb950"/>
    <rect x="144" y="102" width="40" height="16" rx="3" fill="#3fb950"/>
    <rect x="192" y="102" width="40" height="16" rx="3" fill="#8ac640"/>
    <rect x="240" y="102" width="40" height="16" rx="3" fill="#d4c530"/>
    <rect x="288" y="102" width="40" height="16" rx="3" fill="#e8a02a"/>
    <rect x="336" y="102" width="40" height="16" rx="3" fill="#e05a2a"/>
    <rect x="384" y="102" width="32" height="16" rx="3" fill="#4a4f56"/>
    <rect x="88" y="136" width="336" height="28" rx="6" fill="#2c3036"/>
    <rect x="96" y="142" width="40" height="16" rx="3" fill="#3fb950"/>
    <rect x="144" y="142" width="40" height="16" rx="3" fill="#3fb950"/>
    <rect x="192" y="142" width="40" height="16" rx="3" fill="#8ac640"/>
    <rect x="240" y="142" width="40" height="16" rx="3" fill="#d4c530"/>
    <rect x="288" y="142" width="40" height="16" rx="3" fill="#4a4f56"/>
    <rect x="336" y="142" width="40" height="16" rx="3" fill="#4a4f56"/>
    <rect x="384" y="142" width="32" height="16" rx="3" fill="#4a4f56"/>
  </g>
  <!-- four fader channels: a track, and a cap at the channel's level -->
  <g fill="#2c3036">
    <rect x="112" y="200" width="20" height="232" rx="10"/>
    <rect x="200" y="200" width="20" height="232" rx="10"/>
    <rect x="288" y="200" width="20" height="232" rx="10"/>
    <rect x="376" y="200" width="20" height="232" rx="10"/>
  </g>
  <g fill="#3d85b8" stroke="#1f2226" stroke-width="6">
    <rect x="92" y="236" width="60" height="40" rx="10"/>
    <rect x="180" y="316" width="60" height="40" rx="10"/>
    <rect x="268" y="268" width="60" height="40" rx="10"/>
    <rect x="356" y="364" width="60" height="40" rx="10"/>
  </g>
  <!-- the cap's grip line -->
  <g stroke="#1f2226" stroke-width="4" stroke-linecap="round">
    <line x1="106" y1="256" x2="138" y2="256"/>
    <line x1="194" y1="336" x2="226" y2="336"/>
    <line x1="282" y1="288" x2="314" y2="288"/>
    <line x1="370" y1="384" x2="402" y2="384"/>
  </g>
</svg>
